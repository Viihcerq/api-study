services:
  db:
    image: postgres
    environment:
      - POSTGRES_USER=new_user
      - POSTGRES_PASSWORD=my_pwd
      - POSTGRES_DB=my_database
    ports:
      - 5432:5432
    networks:
      - app-networks
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U new_user -h localhost" ]
      interval: 5s
      timeout: 3s
      retries: 5
  api:
    build: .
    #image: viihcerq/study-apir:0.0.1
    depends_on:
        db:
          condition: service_healthy
    ports:
      - 9000:9000
    environment:
      - DB_SERVER=db
      - DB_PORT=5432
      - DB_DATABASE=postgres
      - DB_USER=new_user
      - DB_PASSWORD=my_pwd
    networks:
      - app-networks

networks:
  app-networks: